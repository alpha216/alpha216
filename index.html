<!doctype html>
<html lang="ko">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&display=swap">
<body>
<!-- Three.js가 생성한 canvas가 들어갈 영역입니다. -->
<!-- 캔버스 위에 겹치는 HTML 타이틀: 처음엔 파란 상자(.title-wipe)가 지나가고, 이후엔 채움(.title-fill)이 대각선으로 바뀝니다. -->
<div id="title" aria-live="polite">
  <div class="title-bar" aria-hidden="true"></div>
  <p class="title-text">
    <span class="title-outline" aria-hidden="true"></span>
    <span class="title-fill"></span>
  </p>
  <div class="title-wipe" aria-hidden="true"></div>
</div>
<main id="scene" aria-label="칠판 옆 창문 너머로 벚꽃과 하늘이 보이는 교실"></main>
<!-- 그래픽 초기화 실패 또는 WebGL 연결 손실 시 표시합니다. -->
<p id="error" hidden>벚꽃나무를 표시하려면 WebGL을 지원하는 브라우저가 필요합니다.</p>
<!-- 전체 장면을 생성하고 렌더링을 시작하는 진입점입니다. -->
<script type="module" src="/src/main.js"></script>
</body>
</html>
